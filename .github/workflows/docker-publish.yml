# GitHub Actions workflow to build and publish Docker images to ghcr.io
#
# Overview:
# Builds all 6 Legal STF Docker images and pushes to GitHub Container Registry
# Triggered on push to main branch or manual workflow dispatch
#
# Images published:
# - ghcr.io/d6e-ai/stf-nda-triage
# - ghcr.io/d6e-ai/stf-contract-review
# - ghcr.io/d6e-ai/stf-legal-risk-assessment
# - ghcr.io/d6e-ai/stf-compliance
# - ghcr.io/d6e-ai/stf-canned-responses
# - ghcr.io/d6e-ai/stf-meeting-briefing

name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'stf-*/**'
      - 'shared/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: d6e-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        stf:
          - stf-nda-triage
          - stf-contract-review
          - stf-legal-risk-assessment
          - stf-compliance
          - stf-canned-responses
          - stf-meeting-briefing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy shared utilities
        run: |
          cp -r shared ${{ matrix.stf }}/shared

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.stf }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.stf }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.stf }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
        continue-on-error: true

      - name: Make package public
        run: |
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/${{ env.IMAGE_PREFIX }}/packages/container/${{ matrix.stf }}/versions \
            -d '{"visibility":"public"}' || true
        continue-on-error: true

  summary:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| stf-nda-triage | ghcr.io/d6e-ai/stf-nda-triage:latest |" >> $GITHUB_STEP_SUMMARY
          echo "| stf-contract-review | ghcr.io/d6e-ai/stf-contract-review:latest |" >> $GITHUB_STEP_SUMMARY
          echo "| stf-legal-risk-assessment | ghcr.io/d6e-ai/stf-legal-risk-assessment:latest |" >> $GITHUB_STEP_SUMMARY
          echo "| stf-compliance | ghcr.io/d6e-ai/stf-compliance:latest |" >> $GITHUB_STEP_SUMMARY
          echo "| stf-canned-responses | ghcr.io/d6e-ai/stf-canned-responses:latest |" >> $GITHUB_STEP_SUMMARY
          echo "| stf-meeting-briefing | ghcr.io/d6e-ai/stf-meeting-briefing:latest |" >> $GITHUB_STEP_SUMMARY
